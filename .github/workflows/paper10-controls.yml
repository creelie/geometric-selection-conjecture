name: Paper 10 consolidated construction controls
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  construction-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic checker
        run: python -m pip install sympy==1.14.0
      - name: Verify current payload manifest and research scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('[Paper_10] package')
          for e in json.loads((p/'PACKAGE-MANIFEST.json').read_text()):
              assert hashlib.sha256((p/e['path']).read_bytes()).hexdigest()==e['sha256'],e['path']
          assert not json.loads((p/'proof-status.json').read_text())['full_GSC_proved']
          assert not (p/'DOI-RECEIPT.json').exists()
          assert not list(p.rglob('*.zip'))
          PY
      - name: Recompute smoothness, cohomology, singlet and integer certificates
        run: |
          p='[Paper_10] package/Annals-review-draft/tex-source'
          python "$p/anc/smoothness.py"
          python "$p/anc/spectrum.py"
          python "$p/anc/matrix_certificate.py"
          python "$p/anc/controls.py"
          git diff --exit-code -- "$p/anc" "$p/matrix-certificates.tex"
