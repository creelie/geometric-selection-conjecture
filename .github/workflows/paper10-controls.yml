name: Paper 10 consolidated construction controls
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  construction-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic checker
        run: python -m pip install sympy==1.14.0
      - name: Verify current payload manifest and research scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('[Paper_10] package')
          for e in json.loads((p/'PACKAGE-MANIFEST.json').read_text()):
              assert hashlib.sha256((p/e['path']).read_bytes()).hexdigest()==e['sha256'],e['path']
          assert not json.loads((p/'proof-status.json').read_text())['full_GSC_proved']
          if (p/'DOI-RECEIPT.json').exists():
              receipt=json.loads((p/'DOI-RECEIPT.json').read_text())
              assert receipt['status']=='published-and-archive-verified'
              assert receipt['version']=='2.1.0' and receipt['doi'].startswith('10.5281/zenodo.')
          else:
              assert not list(p.rglob('*.zip'))
          PY
      - name: Recompute smoothness, cohomology, singlet and integer certificates
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess,sys
          p=Path('[Paper_10] package/Annals-review-draft/tex-source')
          names=['smoothness-results.json','spectrum-results.json','matrix-certificates.json','control-results.json']
          expected={name:json.loads((p/'anc'/name).read_text()) for name in names}
          matrix=(p/'matrix-certificates.tex').read_text()
          for name in ['smoothness.py','spectrum.py','matrix_certificate.py','controls.py']:
              subprocess.run([sys.executable,'-B',str(p/'anc'/name)],check=True)
          for name in names:
              assert json.loads((p/'anc'/name).read_text())==expected[name],name
          assert (p/'matrix-certificates.tex').read_text()==matrix
          print('Every exact result and matrix certificate reproduced; platform line endings ignored.')
          PY
